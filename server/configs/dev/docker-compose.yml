version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gomob
      POSTGRES_PASSWORD: gomob_dev
      POSTGRES_DB: gomob
    ports:
      - "5432:5432"
    volumes:
      - gomob-pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gomob
      MINIO_ROOT_PASSWORD: gomob_dev_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gomob-minio:/data

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  gomob-pg:
  gomob-minio:
