syntax = "proto3";

package gomob.cvengine.v1;

option go_package = "io.gomob/server/proto/cvengine/v1;cvenginev1";

// 通用 CV 引擎的内部健康与模型查询契约。
// VIN bundle、标定、正射还原和 OCR 由独立 vin-rubbing-service 提供，
// 因此本契约不再包含任何 VIN 网络消息或旧 /cv/ocr/v1 方法。
service CVEngine {
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ListModelsRequest {}

message ModelStatus {
  string tag = 1;
  string kind = 2;
  string path = 3;
  bool loaded = 4;
  int64 size_bytes = 5;
  string loaded_at = 6;
  string error = 7;
  bool opencv_empty = 8;
  repeated string classes = 9;
}

message ListModelsResponse {
  repeated ModelStatus items = 1;
  int32 total = 2;
  int32 loaded_count = 3;
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  int64 uptime_sec = 2;
  string opencv_version = 3;
  string gocv_version = 4;
  string go_version = 5;
}
