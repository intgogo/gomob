[versions]
# Build
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
gradle = "8.10.2"

# AndroidX core
androidxCoreKtx = "1.15.0"
androidxLifecycle = "2.8.7"
androidxActivity = "1.10.1"
androidxNavigation = "2.9.8"
androidxAnnotation = "1.9.1"
androidxCamera = "1.4.1"
androidxStartup = "1.2.0"

# Compose
composeBom = "2025.01.00"
composeCompiler = "1.5.15"

# Hilt / DI
hilt = "2.53.1"
hiltExt = "1.2.0"

# Async / Flow
coroutines = "1.9.0"

# Persistence
room = "2.6.1"
datastore = "1.1.1"

# Serialization / JSON
kotlinxSerialization = "1.7.3"

# Network
okhttp = "4.12.0"
retrofit = "2.11.0"
zxing = "3.5.3"

# 3D / rendering
filament = "1.57.1"

# 毛玻璃 backdrop blur (API31+ 真模糊, 以下自动降级半透明)
# 钉 1.2.2: 1.3.x 的 positionOnScreen 映射在 HyperOS 真机上失效(hazeEffect 全透明), 1.2.x 用窗口坐标正常
haze = "1.2.2"

# LiveKit (多人视频 / SFU)
livekit = "2.18.2"

# Logging
timber = "5.0.1"

# Testing
junit = "4.13.2"
androidxTestExt = "1.2.1"
androidxTestRunner = "1.6.2"
espresso = "3.6.1"
truth = "1.4.4"

# Native
ndk = "27.2.12479018"
cmake = "3.22.1"

# SDK levels
compileSdk = "35"
minSdk = "26"
targetSdk = "35"

[libraries]
# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "androidxStartup" }

# CameraX (主摄像头流)
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }
androidx-camera-video = { module = "androidx.camera:camera-video", version.ref = "androidxCamera" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltExt" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# DataStore
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Network
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# Filament（3D 实时渲染：点云/Mesh 预览）
filament-android = { module = "com.google.android.filament:filament-android", version.ref = "filament" }
filament-utils-android = { module = "com.google.android.filament:filament-utils-android", version.ref = "filament" }

# LiveKit Android SDK (内置 libwebrtc，统一 SFU 接入)
livekit-android = { module = "io.livekit:livekit-android", version.ref = "livekit" }
gltfio-android = { module = "com.google.android.filament:gltfio-android", version.ref = "filament" }

# Logging
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

# Build-logic 用：把插件 artifact 暴露为 library
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# 项目内 convention 插件
gomob-android-application = { id = "gomob.android.application" }
gomob-android-application-compose = { id = "gomob.android.application.compose" }
gomob-android-library = { id = "gomob.android.library" }
gomob-android-library-compose = { id = "gomob.android.library.compose" }
gomob-android-feature = { id = "gomob.android.feature" }
gomob-android-hilt = { id = "gomob.android.hilt" }
gomob-android-native = { id = "gomob.android.native" }
gomob-jvm-library = { id = "gomob.jvm.library" }
